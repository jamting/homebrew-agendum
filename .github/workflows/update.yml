# Keeps Formula/agendum.rb on Agendum's latest GitHub Release, then checks
# that it installs and runs on a fresh Mac (meeting 2026-10-30-2020, §§ 7, 9).
# Runs every morning and by hand (`gh workflow run update.yml`), so no token
# for this repository has to live in jamting/agendum.
name: update

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - id: bump
        name: Point the formula at the latest release
        run: |
          tag=$(gh release view --repo jamting/agendum --json tagName -q .tagName)
          version="${tag#v}"
          if grep -q "version \"$version\"" Formula/agendum.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          gh release download "$tag" --repo jamting/agendum --pattern agendum --dir dl
          sha=$(sha256sum dl/agendum | cut -d' ' -f1)
          sed -i \
            -e "s|releases/download/v[^/]*/agendum|releases/download/$tag/agendum|" \
            -e "s|^  version \".*\"|  version \"$version\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$sha\"|" \
            Formula/agendum.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "agendum $version"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # a fresh Mac, as a stranger would: install from the tap and run it
  install:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - run: brew install jamting/agendum/agendum
      - run: agendum --help | grep -q "agendum --demo"
      - run: brew test jamting/agendum/agendum
